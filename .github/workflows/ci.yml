name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes its running checks. Every other run gets a group of
# its own, so each commit on main still produces its artifacts: within one group GitHub keeps only
# the newest pending run even with cancel-in-progress off, which is how a per-branch group cancelled
# the queued run of one merge when the next merge arrived.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Windows x64 (build, test, lint, package)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # No step pushes or fetches again; do not leave the token in .git/config for build scripts.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # commit of 2026-10-16 on the stable branch
        with:
          # Must match rust-toolchain.toml: that file decides what cargo runs, this decides what the action installs.
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Build (release)
        run: cargo build --locked --release --workspace
      - name: Verify the built executable (static C runtime, DPI manifest)
        shell: pwsh
        run: ./installer/tests/test-dpi-manifest.ps1
      - name: Test
        run: cargo test --locked --workspace
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Regenerate brand assets and check they are committed
        shell: pwsh
        run: |
          cargo run --locked --release -p any2odyssey-iconmaker -- assets
          git diff --exit-code -- assets
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1
      # The installer tests assemble their own package folder from the repository, so nothing
      # else opens the ZIP that is published: a file missing from package.ps1's lists would ship.
      - name: Verify the packaged ZIP (complete, passes the installer's preflight)
        shell: pwsh
        env:
          ANY2ODYSSEY_SKIP_OS_CHECK: '1'
        run: ./scripts/verify-package.ps1
      - name: Stage the built executable for the installer tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          Copy-Item target/release/Any2Odyssey.exe build/
      # Every test-*.ps1 except the DPI manifest check above; the skip variable keeps
      # install.ps1's Windows 11 24H2 gate from depending on the runner image.
      - name: Installer tests (PowerShell 7)
        shell: pwsh
        env:
          ANY2ODYSSEY_SKIP_OS_CHECK: '1'
        run: |
          foreach($test in Get-ChildItem -LiteralPath installer/tests -Filter 'test-*.ps1' | Where-Object Name -ne 'test-dpi-manifest.ps1' | Sort-Object Name){ & $test.FullName }
      # Install.cmd, Uninstall.ps1 and the registry UninstallString all run Windows PowerShell 5.1,
      # so the same scripts must pass under that interpreter too.
      - name: Installer tests (Windows PowerShell 5.1)
        shell: powershell
        env:
          ANY2ODYSSEY_SKIP_OS_CHECK: '1'
        run: |
          foreach($test in Get-ChildItem -LiteralPath installer/tests -Filter 'test-*.ps1' | Where-Object Name -ne 'test-dpi-manifest.ps1' | Sort-Object Name){ & $test.FullName }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Any2Odyssey-windows-x64-exe
          path: target/release/Any2Odyssey.exe
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Any2Odyssey-windows-x64-zip
          retention-days: 14
          path: |
            dist/*.zip
            dist/*.sha256

  # The Linux edition as Arch-based distributions install it: the in-tree PKGBUILD
  # builds, runs the tests and packages as an unprivileged user, then the package
  # is installed and its desktop entry and executable are checked.
  arch-package:
    name: Arch Linux package (makepkg)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: archlinux:base-devel
    steps:
      # makepkg runs as a user without sudo, so the package's own dependencies are installed here.
      - name: Packaging tools and the package's dependencies
        run: pacman -Syu --noconfirm --needed git rustup desktop-file-utils libxkbcommon libglvnd hicolor-icon-theme libpipewire clang
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build, test and package
        run: |
          useradd -m build
          chown -R build:build .
          # rust-toolchain.toml selects the pinned toolchain; rustup installs it on first use.
          su build -c 'cd packaging/arch && makepkg --noconfirm'
      - name: Install the package and check what it installed
        run: |
          pacman -U --noconfirm packaging/arch/any2odyssey-*.pkg.tar.zst
          desktop-file-validate /usr/share/applications/any2odyssey.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/any2odyssey.png
          test -x /usr/share/any2odyssey/wine-lens/setup.sh
          test -s /usr/share/licenses/any2odyssey/THIRD-PARTY-LICENSES-LINUX.md
          test -s /usr/lib/udev/rules.d/70-any2odyssey-lens.rules
          any2odyssey-setup --help
          any2odyssey-setup --dry-run --no-deps --no-odyssey < /dev/null
          any2odyssey --help
          # Exit 1, not a hang or a crash, when no instance is running.
          code=0; any2odyssey --quit || code=$?
          test "$code" -eq 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: any2odyssey-arch-x86_64
          retention-days: 14
          path: packaging/arch/any2odyssey-*.pkg.tar.zst

  linux:
    name: Linux ${{ matrix.arch }} (core, iconmaker, app)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # commit of 2026-10-16 on the stable branch
        with:
          # Must match rust-toolchain.toml: that file decides what cargo runs, this decides what the action installs.
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Desktop build dependencies (eframe, tray-icon, global-hotkey; PipeWire for live capture)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libxkbcommon-dev libwayland-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libssl-dev pkg-config libpipewire-0.3-dev libclang-dev clang \
            desktop-file-utils libglib2.0-bin
      - name: Release installer and desktop launcher tests
        run: python3 packaging/linux/tests/test-install.py
      - name: Format check
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --locked -p any2odyssey-core -p any2odyssey-iconmaker -p any2odyssey
      # USER-GUIDE.html is the exported Help; 0.8.1 shipped a stale copy.
      - name: Offline guide matches the embedded Help topics
        if: matrix.arch == 'x86_64'
        run: |
          cargo run --locked -p any2odyssey -- --export-guide /tmp/guide.html
          cmp /tmp/guide.html USER-GUIDE.html
      - name: Test
        run: cargo test --locked -p any2odyssey-core -p any2odyssey-iconmaker -p any2odyssey
      - name: Camera bridge authentication tests (no hardware)
        run: python3 contrib/wine-lens/tests/test-camera-bridge.py
      - name: UDP shim lifetime tests (no hardware)
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -pthread \
            contrib/wine-lens/tests/test-connreset.c -o /tmp/test-connreset
          ASAN_OPTIONS=detect_leaks=0 /tmp/test-connreset
      - name: Clippy
        run: cargo clippy --locked -p any2odyssey-core -p any2odyssey-iconmaker -p any2odyssey --all-targets -- -D warnings
      - name: Camera reader lifecycle tests (no hardware)
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined \
            contrib/wine-lens/tests/test-camera-stream.c -o /tmp/test-camera-stream
          ASAN_OPTIONS=detect_leaks=0 /tmp/test-camera-stream
      - name: Camera reader threaded shutdown tests (no hardware)
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -pthread \
            contrib/wine-lens/tests/test-camera-reader.c -o /tmp/test-camera-reader
          ASAN_OPTIONS=detect_leaks=0 timeout 30 /tmp/test-camera-reader
      - name: Windows cross-check (no linking)
        if: matrix.arch == 'x86_64'
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo check --locked --workspace --target x86_64-pc-windows-msvc
      # The archive release.yml publishes, made the same way, so a change that breaks it shows here.
      - name: Third-party list for Linux matches the dependencies
        if: matrix.arch == 'x86_64'
        run: |
          scripts/third-party-linux.py > /tmp/third-party-linux.md
          diff -u THIRD-PARTY-LICENSES-LINUX.md /tmp/third-party-linux.md
      - name: Package the Linux archive
        if: matrix.arch == 'x86_64'
        run: |
          cargo build --locked --release -p any2odyssey
          scripts/package-linux.sh
          cd dist && sha256sum -c ./*.sha256
          mkdir check && tar -xzf ./*.tar.gz -C check --strip-components=1
          check/any2odyssey --help
          sh -n check/wine-lens/setup.sh
          test -x check/wine-lens/setup.sh -a -x check/wine-lens/any2odyssey-weaver -a -x check/wine-lens/tools/tracking.sh
          test -s check/THIRD-PARTY-LICENSES-LINUX.md -a -s check/wine-lens/LICENSE-MIT
          # The installer: into a folder of its own, without the steps that need root or hardware.
          check/install.sh --prefix "$PWD/prefix" --no-deps --no-udev --no-model --no-odyssey
          prefix/bin/any2odyssey --help
          desktop-file-validate prefix/share/applications/any2odyssey.desktop || true
          test -x prefix/share/any2odyssey/wine-lens/setup.sh
          prefix/share/any2odyssey/install.sh --prefix "$PWD/prefix" --uninstall < /dev/null
          test ! -e prefix/bin/any2odyssey -a ! -e prefix/share/any2odyssey
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.arch == 'x86_64'
        with:
          name: Any2Odyssey-linux-x86_64-archive
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.sha256
