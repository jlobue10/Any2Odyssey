name: Release

on:
  push:
    tags: ['v*']

# No token permissions by default; each job states the ones it needs.
permissions: {}

# One release run per tag at a time: a second push of the same tag waits for the first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, test and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    # Build scripts, tests and third-party actions run in this job. Its token can only read, and
    # the checkout leaves no credentials in .git/config, so nothing here can push or alter a release.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Left in .git/config, the token is readable by every build script, proc-macro and test
          # that runs below. This job's token can only read, and the publish job has its own.
          persist-credentials: false
      # The publish job refuses this too. Checking first saves a full build on a re-run.
      - name: Stop early if this tag's release already has assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          lookup_error=$(mktemp)
          if assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '[.assets[].name] | join(", ")' 2>"$lookup_error"); then
            if [ -n "$assets" ]; then
              echo "::error::Release $TAG already has assets ($assets). A release is never replaced by a different build: delete those assets by hand if this run is meant to supply them, or publish the change under a new version."
              exit 1
            fi
            echo "Release $TAG exists without assets; this run will add them."
          elif grep -q 'HTTP 404' "$lookup_error"; then
            echo "No release for $TAG yet."
          else
            cat "$lookup_error" >&2
            echo "::error::Could not find out whether release $TAG already exists."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # commit of 2026-10-16 on the stable branch
        with:
          # Must match rust-toolchain.toml: that file decides what cargo runs, this decides what the action installs.
          toolchain: 1.99.1
          components: clippy, rustfmt
      # No build cache here: a cache saved by a tag run can be restored by no other ref, and the
      # released binary is built from scratch.
      - name: Verify tag matches VERSION
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version=(Get-Content VERSION -Raw).Trim()
          if ($env:TAG -ne "v$version") { throw "Tag $env:TAG does not match VERSION $version" }
          # The release notes link to the changelog entry; refuse to publish a version that has none.
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## $([regex]::Escape($version)) " -Quiet)) { throw "CHANGELOG.md has no entry for $version" }
          # README names the current release in its status line; it has been left behind before.
          if (-not (Select-String -Path README.md -SimpleMatch -Pattern "$version is the current release" -Quiet)) { throw "README.md does not name $version as the current release" }
      # Same checks as ci.yml: a tag can be pushed from a commit whose CI never ran or failed.
      - name: Format check
        run: cargo fmt --all --check
      - name: Build (release)
        run: cargo build --locked --release --workspace
      - name: Verify the built executable (static C runtime, DPI manifest)
        shell: pwsh
        run: |
          ./installer/tests/test-dpi-manifest.ps1
          # Remembered so the Package step can refuse an executable that a later step rebuilt.
          "TESTED_EXE_SHA256=$((Get-FileHash -LiteralPath target/release/Any2Odyssey.exe -Algorithm SHA256).Hash)" >> $env:GITHUB_ENV
      - name: Test
        run: cargo test --locked --workspace
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Regenerate brand assets and check they are committed
        shell: pwsh
        run: |
          cargo run --locked --release -p any2odyssey-iconmaker -- assets
          git diff --exit-code -- assets
      - name: Stage the built executable for the installer tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          Copy-Item target/release/Any2Odyssey.exe build/
      - name: Installer tests (PowerShell 7)
        shell: pwsh
        env:
          ANY2ODYSSEY_SKIP_OS_CHECK: '1'
        run: |
          foreach($test in Get-ChildItem -LiteralPath installer/tests -Filter 'test-*.ps1' | Where-Object Name -ne 'test-dpi-manifest.ps1' | Sort-Object Name){ & $test.FullName }
      - name: Installer tests (Windows PowerShell 5.1)
        shell: powershell
        env:
          ANY2ODYSSEY_SKIP_OS_CHECK: '1'
        run: |
          foreach($test in Get-ChildItem -LiteralPath installer/tests -Filter 'test-*.ps1' | Where-Object Name -ne 'test-dpi-manifest.ps1' | Sort-Object Name){ & $test.FullName }
      # Same check as the Linux CI job: USER-GUIDE.html is the exported Help and 0.8.1 shipped a stale copy.
      - name: Offline guide matches the embedded Help topics
        shell: pwsh
        run: |
          $exported=Join-Path $env:RUNNER_TEMP 'guide.html'
          # Run the executable that was built and tested above. `cargo run -p any2odyssey` resolves
          # features for one package instead of the workspace and relinks Any2Odyssey.exe, so the
          # package would carry a binary no check had seen (as 0.8.6 did). It is a GUI-subsystem
          # program: Start-Process -Wait is what makes PowerShell wait for it and see its exit code.
          $export=Start-Process -FilePath target/release/Any2Odyssey.exe -ArgumentList '--export-guide',('"'+$exported+'"') -Wait -PassThru
          if ($export.ExitCode -ne 0) { throw "--export-guide exited $($export.ExitCode)" }
          $normalize={param($path)([IO.File]::ReadAllText($path)).Replace("`r`n","`n")}
          # Ordinal: PowerShell's -ne ignores letter case and compares linguistically.
          if (-not [string]::Equals((& $normalize $exported),(& $normalize 'USER-GUIDE.html'),[StringComparison]::Ordinal)) { throw 'USER-GUIDE.html differs from the embedded Help; regenerate it with --export-guide' }
      - name: Package
        shell: pwsh
        run: |
          $now=(Get-FileHash -LiteralPath target/release/Any2Odyssey.exe -Algorithm SHA256).Hash
          if ($now -ne $env:TESTED_EXE_SHA256) { throw "Any2Odyssey.exe changed after it was verified and tested ($env:TESTED_EXE_SHA256 -> $now); a later step rebuilt it." }
          ./scripts/package.ps1
      # The installer tests assemble their own package folder from the repository, so nothing
      # else opens the ZIP that is published: a file missing from package.ps1's lists would ship.
      - name: Verify the packaged ZIP (complete, passes the installer's preflight)
        shell: pwsh
        env:
          ANY2ODYSSEY_SKIP_OS_CHECK: '1'
        run: ./scripts/verify-package.ps1
      # Handed to the publish job, which is the only one allowed to write to the repository.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Any2Odyssey-release-package
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.sha256

  # The Linux edition, two ways: an archive for any recent distribution and a package for Arch-based ones.
  # Like the Windows job, these build and test with a token that can only read.
  linux-archive:
    name: Build, test and package Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # commit of 2026-10-16 on the stable branch
        with:
          # Must match rust-toolchain.toml: that file decides what cargo runs, this decides what the action installs.
          toolchain: 1.99.1
          components: clippy, rustfmt
      - name: Verify tag matches VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: test "$TAG" = "v$(tr -d '[:space:]' < VERSION)"
      - name: Desktop build dependencies (eframe; PipeWire for live capture)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libxkbcommon-dev libwayland-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libssl-dev pkg-config libpipewire-0.3-dev libclang-dev clang
      - name: Build (release)
        run: cargo build --locked --release -p any2odyssey
      - name: Test
        run: cargo test --locked --release -p any2odyssey-core -p any2odyssey
      - name: Third-party list for Linux matches the dependencies
        run: |
          scripts/third-party-linux.py > /tmp/third-party-linux.md
          cmp /tmp/third-party-linux.md THIRD-PARTY-LICENSES-LINUX.md
      - name: Package
        run: |
          before=$(sha256sum target/release/Any2Odyssey)
          scripts/package-linux.sh
          # The archive must hold the executable that was tested, not one a later step rebuilt.
          test "$before" = "$(sha256sum target/release/Any2Odyssey)"
          cd dist && sha256sum -c ./*.sha256
          mkdir check && tar -xzf ./*.tar.gz -C check --strip-components=1
          check/any2odyssey --help
          test "$(sha256sum < check/any2odyssey)" = "$(sha256sum < ../target/release/Any2Odyssey)"
          rm -rf check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Any2Odyssey-release-linux-archive
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.sha256

  arch-package:
    name: Build, test and package for Arch Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: archlinux:base-devel
    permissions:
      contents: read
    steps:
      # makepkg runs as a user without sudo, so the package's own dependencies are installed here.
      - name: Packaging tools and the package's dependencies
        run: pacman -Syu --noconfirm --needed git rustup desktop-file-utils libxkbcommon libglvnd hicolor-icon-theme libpipewire clang
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build, test and package
        run: |
          useradd -m build
          chown -R build:build .
          su build -c 'cd packaging/arch && makepkg --noconfirm'
      - name: Install the package and check what it installed
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ls packaging/arch/any2odyssey-"${TAG#v}"-*-x86_64.pkg.tar.zst
          pacman -U --noconfirm packaging/arch/any2odyssey-*.pkg.tar.zst
          desktop-file-validate /usr/share/applications/any2odyssey.desktop
          any2odyssey --help
          test -x /usr/share/any2odyssey/wine-lens/setup.sh
          test -s /usr/share/licenses/any2odyssey/THIRD-PARTY-LICENSES-LINUX.md
          mkdir dist && cp packaging/arch/any2odyssey-*.pkg.tar.zst dist/
          cd dist && for f in ./*.pkg.tar.zst; do sha256sum "${f#./}" > "${f#./}.sha256"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Any2Odyssey-release-arch-package
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.pkg.tar.zst
            dist/*.sha256

  publish:
    name: Publish the GitHub release
    needs: [build, linux-archive, arch-package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job with a write token. It checks out nothing and runs no code from the repository:
    # it downloads the package the build job made, verifies it and attaches it to the release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Any2Odyssey-release-package
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Any2Odyssey-release-linux-archive
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Any2Odyssey-release-arch-package
          path: dist
      - name: Verify the packages against their SHA-256
        working-directory: dist
        run: |
          ls -l
          if [ "$(ls -1 ./*.zip | wc -l)" -ne 1 ] || [ "$(ls -1 ./*.tar.gz | wc -l)" -ne 1 ] ||
             [ "$(ls -1 ./*.pkg.tar.zst | wc -l)" -ne 1 ] || [ "$(ls -1 ./*.sha256 | wc -l)" -ne 3 ]; then
            echo "::error::Expected exactly one ZIP, one Linux archive and one Arch package, each with its .sha256 file."
            exit 1
          fi
          for sum in ./*.sha256; do sha256sum -c "$sum"; done
      # softprops/action-gh-release would otherwise replace same-named assets (a re-run, a re-pushed
      # tag) with a different build of the same version, without a word.
      - name: Refuse to replace the assets of an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          lookup_error=$(mktemp)
          if assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '[.assets[].name] | join(", ")' 2>"$lookup_error"); then
            if [ -n "$assets" ]; then
              echo "::error::Release $TAG already has assets ($assets). A release is never replaced by a different build: delete those assets by hand if this run is meant to supply them, or publish the change under a new version."
              exit 1
            fi
            echo "Release $TAG exists without assets; this run will add them."
          elif grep -q 'HTTP 404' "$lookup_error"; then
            echo "No release for $TAG yet."
          else
            cat "$lookup_error" >&2
            echo "::error::Could not find out whether release $TAG already exists."
            exit 1
          fi
      - name: Create GitHub release with the packages and their SHA-256 files
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.pkg.tar.zst
            dist/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Second line of defence behind the step above: never overwrite an existing asset.
          overwrite_files: false
          body: |
            Any2Odyssey ${{ github.ref_name }}. Verify a download against its attached `.sha256`.

            **Windows x64** (`Any2Odyssey-*-windows-x64.zip`): extract the ZIP and run `Install.cmd` (full converter, needs Odyssey 3D Hub 1.5.1) or `Install-GUI.cmd` (controls only).

            **Linux x86_64**: the stereo viewer, with glasses-free output on an Odyssey 3D for images and a live screen through your own copy of Leia's runtime under Wine (experimental; see `docs/LENS-SWITCH.md`). On Arch-based distributions install `any2odyssey-*-x86_64.pkg.tar.zst` with `sudo pacman -U`. Elsewhere extract `Any2Odyssey-*-linux-x86_64.tar.gz` (built on Ubuntu 24.04; needs glibc 2.39 or newer and PipeWire) and read its `INSTALL.txt`.
