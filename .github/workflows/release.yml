name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-release:
    name: Build and attach Windows x64 package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # This job's token can write releases. Left in .git/config it is readable by every
          # build script, proc-macro and test that runs below; the release step has its own.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # commit of 2026-10-16 on the stable branch
        with:
          # Must match rust-toolchain.toml: that file decides what cargo runs, this decides what the action installs.
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Verify tag matches VERSION
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version=(Get-Content VERSION -Raw).Trim()
          if ($env:TAG -ne "v$version") { throw "Tag $env:TAG does not match VERSION $version" }
          # The release notes link to the changelog entry; refuse to publish a version that has none.
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## $([regex]::Escape($version)) " -Quiet)) { throw "CHANGELOG.md has no entry for $version" }
          # README names the current release in its status line; it has been left behind before.
          if (-not (Select-String -Path README.md -SimpleMatch -Pattern "$version is the current release" -Quiet)) { throw "README.md does not name $version as the current release" }
      # Same checks as ci.yml: a tag can be pushed from a commit whose CI never ran or failed.
      - name: Format check
        run: cargo fmt --all --check
      - name: Build (release)
        run: cargo build --locked --release --workspace
      - name: Verify the built executable (static C runtime, DPI manifest)
        shell: pwsh
        run: |
          ./installer/tests/test-dpi-manifest.ps1
          # Remembered so the Package step can refuse an executable that a later step rebuilt.
          "TESTED_EXE_SHA256=$((Get-FileHash -LiteralPath target/release/Any2Odyssey.exe -Algorithm SHA256).Hash)" >> $env:GITHUB_ENV
      - name: Test
        run: cargo test --locked --workspace
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Regenerate brand assets and check they are committed
        shell: pwsh
        run: |
          cargo run --locked --release -p any2odyssey-iconmaker -- assets
          git diff --exit-code -- assets
      - name: Stage the built executable for the installer tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          Copy-Item target/release/Any2Odyssey.exe build/
      - name: Installer tests (PowerShell 7)
        shell: pwsh
        env:
          ANY2ODYSSEY_SKIP_OS_CHECK: '1'
        run: |
          foreach($test in Get-ChildItem -LiteralPath installer/tests -Filter 'test-*.ps1' | Where-Object Name -ne 'test-dpi-manifest.ps1' | Sort-Object Name){ & $test.FullName }
      - name: Installer tests (Windows PowerShell 5.1)
        shell: powershell
        env:
          ANY2ODYSSEY_SKIP_OS_CHECK: '1'
        run: |
          foreach($test in Get-ChildItem -LiteralPath installer/tests -Filter 'test-*.ps1' | Where-Object Name -ne 'test-dpi-manifest.ps1' | Sort-Object Name){ & $test.FullName }
      # Same check as the Linux CI job: USER-GUIDE.html is the exported Help and 0.8.1 shipped a stale copy.
      - name: Offline guide matches the embedded Help topics
        shell: pwsh
        run: |
          $exported=Join-Path $env:RUNNER_TEMP 'guide.html'
          # Run the executable that was built and tested above. `cargo run -p any2odyssey` resolves
          # features for one package instead of the workspace and relinks Any2Odyssey.exe, so the
          # package would carry a binary no check had seen (as 0.8.6 did). It is a GUI-subsystem
          # program: Start-Process -Wait is what makes PowerShell wait for it and see its exit code.
          $export=Start-Process -FilePath target/release/Any2Odyssey.exe -ArgumentList '--export-guide',('"'+$exported+'"') -Wait -PassThru
          if ($export.ExitCode -ne 0) { throw "--export-guide exited $($export.ExitCode)" }
          $normalize={param($path)([IO.File]::ReadAllText($path)).Replace("`r`n","`n")}
          # Ordinal: PowerShell's -ne ignores letter case and compares linguistically.
          if (-not [string]::Equals((& $normalize $exported),(& $normalize 'USER-GUIDE.html'),[StringComparison]::Ordinal)) { throw 'USER-GUIDE.html differs from the embedded Help; regenerate it with --export-guide' }
      - name: Package
        shell: pwsh
        run: |
          $now=(Get-FileHash -LiteralPath target/release/Any2Odyssey.exe -Algorithm SHA256).Hash
          if ($now -ne $env:TESTED_EXE_SHA256) { throw "Any2Odyssey.exe changed after it was verified and tested ($env:TESTED_EXE_SHA256 -> $now); a later step rebuilt it." }
          ./scripts/package.ps1
      # The installer tests assemble their own package folder from the repository, so nothing
      # else opens the ZIP that is published: a file missing from package.ps1's lists would ship.
      - name: Verify the packaged ZIP (complete, passes the installer's preflight)
        shell: pwsh
        env:
          ANY2ODYSSEY_SKIP_OS_CHECK: '1'
        run: ./scripts/verify-package.ps1
      - name: Create GitHub release with the ZIP and its SHA-256
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Windows x64 package for Any2Odyssey ${{ github.ref_name }}. Extract the ZIP and run `Install.cmd` (full converter, needs Odyssey 3D Hub 1.5.1) or `Install-GUI.cmd` (controls only). Verify the download against the attached `.sha256`.
