[workspace]
resolver = "2"
members = ["crates/core", "crates/windows", "crates/app", "tools/iconmaker"]

[workspace.package]
version = "0.8.6"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/jlobue10/Any2Odyssey"
authors = ["Jonathan LoBue <jlobue10@gmail.com>"]

[workspace.dependencies]
any2odyssey-core = { path = "crates/core", version = "0.8.6" }
any2odyssey-windows = { path = "crates/windows", version = "0.8.6" }
serde = { version = "1", features = ["derive"] }
# preserve_order: Samsung's OverlaySettings.json is read, edited and written
# back, and its keys must come back in the order Samsung wrote them.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
dirs = "6"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"
