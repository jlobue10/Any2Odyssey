[package]
name = "any2odyssey"
description = "Continuous desktop 3D for the Samsung Odyssey G90XF: controls, tray and capture worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[[bin]]
name = "Any2Odyssey"
path = "src/main.rs"

[dependencies]
any2odyssey-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
image.workspace = true
# "accesskit" is the accessibility tree: UI Automation on Windows, AT-SPI on
# Linux. It is one of eframe's default features, and `default-features =
# false` (which keeps wgpu out) had dropped it with the rest: assistive
# software was given the window and nothing in it. The tree is only built
# once something asks for it.
eframe = { version = "0.33", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
egui = { version = "0.33", features = ["accesskit"] }
global-hotkey = "0.7"
open = "5"
html-escape = "0.2"
raw-window-handle = "0.6"
# Each model download owns its staging file through verification and publication.
tempfile = "3"

# Display-server backends are only meaningful off Windows; features unify
# with the entry above, so the Windows build drops the wayland/x11 code.
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["wayland", "x11"] }
# AI depth for the stereo viewer. The runtime library (libonnxruntime.so, from
# the distribution's onnxruntime package) is loaded when the first depth map is
# asked for, so the program starts and the viewer works without it. api-17 is
# the oldest runtime interface the binding has, which covers ONNX Runtime 1.17
# onward: Debian 13 and Ubuntu 25.10 package 1.21. Nothing the program calls is
# newer. Not api-22: with it the binding also sets an automatic choice of
# provider on every session, over which Microsoft's own build of 1.22.0 ends
# the whole program (an assertion on an empty device list).
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-17", "cuda"] }
# Opens cuDNN ahead of ONNX Runtime's CUDA provider (see depth.rs).
libloading = "0.8"

# Live capture of one screen for the Odyssey 3D output: the desktop portal's
# screen cast (the user picks the screen in the desktop's own dialog) and
# the PipeWire stream it hands out. Linux only; needs the PipeWire headers
# and clang (bindgen) to build.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread"] }
pipewire = "0.10"

[target.'cfg(windows)'.dependencies]
any2odyssey-windows.workspace = true
tray-icon = "0.21"
muda = "0.17"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Console"] }

[build-dependencies]
winresource = "0.1"
