[package]
name = "any2odyssey"
description = "Continuous desktop 3D for the Samsung Odyssey G90XF: controls, tray and capture worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[[bin]]
name = "Any2Odyssey"
path = "src/main.rs"

[dependencies]
any2odyssey-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
image.workspace = true
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.33"
global-hotkey = "0.7"
open = "5"
html-escape = "0.2"
raw-window-handle = "0.6"

# Display-server backends are only meaningful off Windows; features unify
# with the entry above, so the Windows build drops the wayland/x11 code.
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["wayland", "x11"] }
# AI depth for the stereo viewer. The runtime library (libonnxruntime.so, from
# the distribution's onnxruntime package) is loaded when the first depth map is
# asked for, so the program starts and the viewer works without it. api-22 is
# the oldest runtime interface accepted, which covers ONNX Runtime 1.22 onward.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-22", "cuda"] }
# Opens cuDNN ahead of ONNX Runtime's CUDA provider (see depth.rs).
libloading = "0.8"

# Live capture of one screen for the Odyssey 3D output: the desktop portal's
# screen cast (the user picks the screen in the desktop's own dialog) and
# the PipeWire stream it hands out. Linux only; needs the PipeWire headers
# and clang (bindgen) to build.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread"] }
pipewire = "0.10"

[target.'cfg(windows)'.dependencies]
any2odyssey-windows.workspace = true
tray-icon = "0.21"
muda = "0.17"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Console"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
