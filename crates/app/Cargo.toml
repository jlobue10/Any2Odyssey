[package]
name = "any2odyssey"
description = "Continuous desktop 3D for the Samsung Odyssey G90XF: controls, tray and capture worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[[bin]]
name = "Any2Odyssey"
path = "src/main.rs"

[dependencies]
any2odyssey-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
image.workspace = true
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.33"
global-hotkey = "0.7"
open = "5"
html-escape = "0.2"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
any2odyssey-windows.workspace = true
tray-icon = "0.21"
muda = "0.17"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_Com"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
